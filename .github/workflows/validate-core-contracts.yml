name: Validate core contracts

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/core-contracts
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Verify story adapters
        run: dart run tool/verificar_historias.dart

      - name: Require all 12 stories active
        shell: bash
        run: |
          cat lib/core/integracion/registro_historias.g.dart
          COUNT=$(grep -c ": 'activa'" lib/core/integracion/registro_historias.g.dart)
          echo "Active stories: $COUNT"
          test "$COUNT" -eq 12

      - name: Analyze integration
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sprint2-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
